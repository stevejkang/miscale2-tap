esphome:
  name: scale-bridge
  min_version: "2026.3.0"

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB

logger:
  level: DEBUG # set VERBOSE to see raw BLE advertise packets (INFO, DEBUG, VERBOSE...)
  hardware_uart: USB_CDC

debug:
  update_interval: never

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  timeout: 10s
  watchdog_timeout: 30s # slow TCP connect blocks the loop past the 5s task watchdog
  # no verify_ssl — LAN-only HTTP

esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 320ms
#  on_ble_advertise:
