esphome:
  name: scale-bridge
  min_version: "2026.3.0"

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB

logger:
  level: INFO # set VERBOSE to see raw BLE advertise packets
  hardware_uart: USB_CDC

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  timeout: 10s
  # no verify_ssl — LAN-only HTTP

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
