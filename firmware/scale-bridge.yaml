#               char hex[40];
#               for (int i = 0; i < 13; i++) snprintf(hex + i*3, 4, "%02X ", sd.data[i]);
#               ESP_LOGI("scale_diag", "RSSI=%d 181B[13]: %s", x.get_rssi(), hex);
#             }
#           }

sensor:
  - platform: xiaomi_miscale
    mac_address: !secret scale_mac
    clear_impedance: true
    weight:
      name: "Weight"
      id: scale_weight
      filters:
        - throttle: 60s
      on_value:
        - delay: 100ms # waits for impedance publish
        - http_request.post:
            url: !secret ingest_url
            request_headers:
              Content-Type: application/json
            body: !lambda |-
              char buf[96];
              float z = id(scale_impedance).state;
              if (std::isnan(z)) {
                snprintf(buf, sizeof(buf), "{\"kg\":%.2f}", x);
              } else {
                snprintf(buf, sizeof(buf), "{\"kg\":%.2f,\"ohm\":%.0f}", x, z);
              }
              return std::string(buf);
    impedance:
      name: "Impedance"
      id: scale_impedance
