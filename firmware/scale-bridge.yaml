#      then:
#       - lambda: |-
#           for (auto &sd : x.get_service_datas()) {
#             if (sd.uuid == esp32_ble_tracker::ESPBTUUID::from_uint16(0x181B) && sd.data.size() == 13) {
#               char hex[40];
#               for (int i = 0; i < 13; i++) snprintf(hex + i*3, 4, "%02X ", sd.data[i]);
#               ESP_LOGI("scale_diag", "RSSI=%d 181B[13]: %s", x.get_rssi(), hex);
#             }
#           }

sensor:
  - platform: xiaomi_miscale
    mac_address: !secret scale_mac
    clear_impedance: true
    weight:
      name: "Weight"
      id: scale_weight
      filters:
        - throttle: 60s
      on_value:
        - delay: 8s # impedance publishes ~5s after the first stabilized weight
        - http_request.post:
            url: !secret ingest_url
            request_headers:
              Content-Type: application/json
            body: !lambda |-
              char buf[96];
              float z = id(scale_impedance).state;
              if (std::isnan(z)) {
                snprintf(buf, sizeof(buf), "{\"kg\":%.2f}", x);
              } else {
                snprintf(buf, sizeof(buf), "{\"kg\":%.2f,\"ohm\":%.0f}", x, z);
              }
              return std::string(buf);
            on_error:
              - logger.log:
                  format: "weight POST failed, measurement lost"
                  level: WARN
    impedance:
      name: "Impedance"
      id: scale_impedance

interval:
  - interval: 5min
    then:
      - lambda: |-
          ESP_LOGI("health", "heap free=%lu min=%lu",
                   (unsigned long) esp_get_free_heap_size(),
                   (unsigned long) esp_get_minimum_free_heap_size());

time:
  - platform: sntp
    timezone: Asia/Seoul
    on_time:
      - hours: 4
        minutes: 0
        seconds: 0
        then:
          - logger.log: "Scheduled daily reboot"
          - delay: 1s
          - button.press: restart_btn

button:
  - platform: restart
    id: restart_btn
